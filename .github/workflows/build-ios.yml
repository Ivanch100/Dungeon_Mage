name: Build iOS IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install @capacitor/ios
      - run: npx cap add ios
      - run: npx capacitor-assets generate --ios
      - run: npx cap sync ios
      - name: Build unsigned app
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then B="-workspace App.xcworkspace"; else B="-project App.xcodeproj"; fi
          xcodebuild $B -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package ipa
        run: |
          mkdir Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r fireball-mage.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: fireball-mage-ipa
          path: fireball-mage.ipa
